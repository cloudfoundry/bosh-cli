---
name: test-release

releases:
- name: bosh-docker-cpi
  url: {{ .CPIReleaseURL }}
- name: sample-release
  url: file://{{ .DummyCompiledReleasePath }}

resource_pools:
- name: fake-resource-pool-name
  network: fake-network-name
  env:
    bosh:
      password: pjF0EjcwDTvyQ # openssl passwd -crypt sshpassword
      mbus:
        cert: ((mbus))
      authorized_keys:
      - ((ssh_tunnel.public_key))
      blobstores:
      - provider: local
        options:
          blobstore_path: /var/vcap/micro_bosh/data/cache
  stemcell:
    url: {{ .StemcellURL }}
  cloud_properties:
    ports:
    - 22/tcp   # ssh_tunnel
    - 6868/tcp # agent mbus

disk_pools:
- name: default
  disk_size: 1024

networks:
- name: fake-network-name
  type: manual
  subnets:
  # Carved out of the docker network created by start-docker (10.245.0.0/16).
  - range: 10.245.0.40/30
    gateway: 10.245.0.41
    dns: [8.8.8.8]
    cloud_properties:
      name: director_network

cloud_provider:
  template:
    name: docker_cpi
    release: bosh-docker-cpi
  mbus: https://admin:admin@10.245.0.42:6868
  cert:
    ca: ((mbus.ca))
  ssh_tunnel:
    host: 10.245.0.42
    port: 22
    user: vcap
    private_key: ((ssh_tunnel.private_key))
  properties:
    docker_cpi: &docker_cpi
      docker:
        host: ((docker_host))
        tls: ((docker_tls))
      agent:
        mbus: https://admin:admin@0.0.0.0:6868
      start_containers_with_systemd: true

instance_groups:
- name: dummy_instance_group
  instances: 1
  jobs:
  - name: sample-job
    release: sample-release
  resource_pool: fake-resource-pool-name
  networks:
  - name: fake-network-name
    static_ips: [10.245.0.42]
  persistent_disk_pool: default
  properties:
    cpi: *docker_cpi
    dummy_with_properties:
      echo_value: "hi"
    ntp: []

variables:
- name: default_ca
  type: certificate
  options:
    is_ca: true
- name: mbus
  type: certificate
  options:
    common_name: bosh.integration.test
    alternative_names: [10.245.0.42]
    ca: default_ca
- name: ssh_tunnel
  type: ssh
